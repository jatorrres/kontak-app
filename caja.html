<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak - Caja y Ventas</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/caja.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<!-- Botón flotante para abrir el menú en móviles -->
<button class="mobile-menu-btn" onclick="toggleMobileSidebar()">
  <i class="bi bi-list"></i>
</button>
  <div class="app-layout">
    <main class="main-content" id="mainContent">
      <div class="top-bar">
        <h2>Módulo de Caja y Facturación</h2>
      </div>

        <!-- GRILLA -->
        <div class="orders-grid" id="ordersGrid"></div>
      </section>

      <!-- Modal Detalle de Cuenta -->
      <div class="modal-overlay" id="modalOverlay" onclick="closeOnOverlayClick(event)">
        <div class="checkout-panel">
          <div class="checkout-header">
            <div>
              <h3 id="selectedTable">Ubicación</h3>
              <small id="selectedWaiter" style="color: #777;">Mesero: Sin asignar</small>
            </div>
            <button class="btn-close" onclick="closeTableDetail()">&times;</button>
          </div>

          <div class="add-item-bar">
            <select id="addItemSelect">
              <option value="">+ Agregar Producto al Pedido...</option>
            </select>
            <button class="btn-primary btn-add-item" onclick="addItemToCurrentTable()">
              <i class="bi bi-plus-lg"></i> Añadir
            </button>
          </div>

          <div class="items-list" id="itemsList"></div>

          <div>
            <label style="font-size: 0.85rem; font-weight: 700; color: var(--dark-coffee);">Método de Pago</label>
            <div class="payment-methods">
              <button class="pay-btn active" onclick="setPaymentMethod('Efectivo', this)">Efectivo</button>
              <button class="pay-btn" onclick="setPaymentMethod('Tarjeta', this)">Tarjeta</button>
              <button class="pay-btn" onclick="setPaymentMethod('Transferencia', this)">Nequi/Davi</button>
            </div>

            <!-- Sección Dinámica para Calculadora de Vuelto / Efectivo -->
            <div id="efectivoContainer" style="margin-top: 10px; background: #f8fafc; padding: 10px; border-radius: 8px; border: 1px solid #e2e8f0;">
              <label style="font-size: 0.8rem; font-weight: 600; color: #475569; display: block; margin-bottom: 4px;">Dinero Recibido en Efectivo:</label>
              <input type="number" id="inputEfectivoRecibido" placeholder="Ej. 50000" oninput="calcularCambio()" style="width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem;">
              <div style="display: flex; justify-content: space-between; font-size: 0.9rem; margin-top: 6px; font-weight: 600; color: #059669;">
                <span>Cambio / Vuelto:</span>
                <span id="cambioCalculado">$ 0</span>
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.2rem; margin: 0.8rem 0; color: var(--dark-coffee);">
              <span>Total:</span>
              <span id="totalAmount">$ 0</span>
            </div>

            <div class="checkout-actions">
              <button class="btn-secondary btn-block" onclick="printDetailedPreBill()">
                📄 Imprimir Pre-Factura
              </button>
              <button class="btn-primary btn-block" onclick="processPayment()">
                💳 Registrar Pago Final
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="sidebar-top">
    <!-- Cambiar toggleMobileSidebar() por toggleSidebar() aquí -->
    <div class="logo-container" onclick="toggleSidebar()" title="Alternar menú">
      <img src="assets/logo-kontak.png" alt="Kontak Logo">
    </div>
    <nav class="sidebar-nav"></nav>
  </div>
  <div class="sidebar-bottom">
    <a href="index.html" class="nav-item logout-btn"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
  </div>
</aside>

  <script src="js/sidebar.js"></script>
  <script src="js/caja.js"></script>
  <script>
    // Función unificada que detecta si estás en PC o Celular al hacer clic en el logo
    window.toggleSidebar = function() {
      const sidebar = document.getElementById('sidebar');
      if (!sidebar) return;

      if (window.innerWidth <= 768) {
        // En móviles, abre o cierra el panel lateral deslizante
        sidebar.classList.toggle('mobile-open');
      } else {
        // En escritorio, colapsa o expande el menú y mueve el contenido
        sidebar.classList.toggle('collapsed');
        const mainContent = document.getElementById('mainContent');
        if (mainContent) {
          mainContent.classList.toggle('expanded');
        }
      }
    };

    window.toggleMobileSidebar = function() {
      const sidebar = document.getElementById('sidebar');
      if (sidebar) {
        sidebar.classList.toggle('mobile-open');
      }
    };
  </script>
</body>
</html>
