<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak - Mi Cuenta</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/cuenta.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <!-- Botón flotante para abrir el menú en móviles -->
<button class="mobile-menu-btn" onclick="toggleMobileSidebar()">
  <i class="bi bi-list"></i>
</button>
  <div class="app-layout">
    <main class="main-content" id="mainContent">
      <div class="account-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h2 style="margin: 0;">⚙️ Perfil de Usuario</h2>
          <!-- Botón para Habilitar/Deshabilitar Edición -->
          <button type="button" class="btn-secondary" id="btnEditProfile" onclick="toggleEditProfile()">
            <i class="bi bi-pencil-square"></i> Editar Perfil
          </button>
        </div>

        <!-- Formulario de Información Personal -->
        <form id="profileForm" onsubmit="saveProfile(event)">
          
          <!-- Selector de Foto de Perfil -->
          <div class="avatar-upload-container">
            <div class="avatar-preview">
              <img id="avatarImg" src="assets/default-avatar.png" alt="Foto de Perfil" onerror="this.src='https://ui-avatars.com/api/?name=Admin+Kontak&background=FF9800&color=fff&size=128'">
            </div>
            <div class="avatar-actions">
              <label for="avatarInput" class="btn-secondary btn-upload input-disabled-style" id="labelUploadAvatar" style="pointer-events: none; opacity: 0.6;">
                <i class="bi bi-camera"></i> Cambiar Foto
              </label>
              <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(event)" hidden disabled>
              <small style="color: #64748B; display: block; margin-top: 0.3rem;">Formatos JPG o PNG (Max 2MB)</small>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group full-width">
              <label>Nombre Completo:</label>
              <input type="text" id="fullName" value="Administrador Kontak" disabled required class="input-disabled-style">
            </div>
<!-- CAMPO NOMBRE DEL NEGOCIO -->
<div class="form-group full-width">
  <label>Nombre del Negocio:</label>
  <input type="text" id="businessName" value="Cargando..." disabled required class="input-disabled-style">
</div>
            <div class="form-group">
              <label>Rol Asignado:</label>
              <input type="text" id="userRoleDisplay" value="Propietario / Administrador" disabled class="input-disabled-style">
            </div>

            <div class="form-group">
              <label>Correo Electrónico:</label>
              <input type="email" id="userEmail" value="admin@kontak.com" disabled required class="input-disabled-style">
            </div>

            <div class="form-group">
              <label>Edad:</label>
              <input type="number" id="userAge" value="28" min="15" max="99" disabled class="input-disabled-style">
            </div>

            <div class="form-group">
              <label>Sexo / Género:</label>
              <select id="userGender" disabled class="input-disabled-style">
                <option value="Masculino" selected>Masculino</option>
                <option value="Femenino">Femenino</option>
                <option value="Otro">Otro</option>
                <option value="No especificado">Prefiero no decirlo</option>
              </select>
            </div>

            <!-- CÓDIGO DE NEGOCIO INTEGRADO EN LA GRILLA -->
            <div class="form-group full-width" style="margin-top: 0.5rem;">
              <label style="color: #FF9800; font-weight: bold;">🔑 Código de Negocio (Para tus empleados):</label>
              <div style="display: flex; gap: 0.5rem; margin-top: 0.3rem;">
                <input type="text" id="businessCode" value="Cargando..." disabled class="input-disabled-style" style="font-weight: bold; letter-spacing: 1px; color: #1E293B !important;">
                <button type="button" class="btn-secondary" onclick="copyBusinessCode()" title="Copiar Código">
                  <i class="bi bi-clipboard"></i> Copiar
                </button>
              </div>
            </div>
          </div>

          <!-- Acciones de perfil (Guardar / Cancelar) -->
          <div id="profileActions" style="display: none; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn-primary">Guardar Cambios</button>
            <button type="button" class="btn-secondary" onclick="toggleEditProfile(false)">Cancelar</button>
          </div>
        </form>

        <hr class="divider">

        <!-- Acordeón Desplegable para Cambiar Contraseña -->
        <div class="password-accordion">
          <button type="button" class="btn-toggle-accordion" onclick="togglePasswordSection()">
            <span>🔒 ¿Deseas cambiar tu contraseña?</span>
            <i class="bi bi-chevron-down" id="accordionIcon"></i>
          </button>

          <div class="accordion-content" id="passwordAccordionContent">
            <form id="passwordForm" onsubmit="changePassword(event)">
              <div class="form-grid" style="margin-top: 1rem;">
                <div class="form-group full-width password-field">
                  <label>Contraseña Actual:</label>
                  <div class="input-password-wrapper">
                    <input type="password" id="currentPassword" placeholder="••••••••" required>
                    <i class="bi bi-eye-slash toggle-password" onclick="togglePasswordVisibility('currentPassword', this)"></i>
                  </div>
                </div>

                <div class="form-group password-field">
                  <label>Nueva Contraseña:</label>
                  <div class="input-password-wrapper">
                    <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" minlength="6" required>
                    <i class="bi bi-eye-slash toggle-password" onclick="togglePasswordVisibility('newPassword', this)"></i>
                  </div>
                </div>

                <div class="form-group password-field">
                  <label>Confirmar Nueva Contraseña:</label>
                  <div class="input-password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Repite la contraseña" minlength="6" required>
                    <i class="bi bi-eye-slash toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)"></i>
                  </div>
                </div>
              </div>

              <div style="display: flex; gap: 0.8rem; margin-top: 1rem;">
                <button type="submit" class="btn-secondary btn-update-password">Actualizar Contraseña</button>
                <button type="button" class="btn-secondary" onclick="togglePasswordSection(false)">Cancelar</button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </main>

    <!-- Sidebar Dinámico -->
   <aside class="sidebar" id="sidebar">
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="sidebar-top">
    <!-- Cambiar toggleMobileSidebar() por toggleSidebar() aquí -->
    <div class="logo-container" onclick="toggleSidebar()" title="Alternar menú">
      <img src="assets/logo-kontak.png" alt="Kontak Logo">
    </div>
    <nav class="sidebar-nav"></nav>
  </div>
  <div class="sidebar-bottom">
    <a href="index.html" class="nav-item logout-btn"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
  </div>
</aside>

  <!-- Scripts del Proyecto -->
 <script src="js/sidebar.js"></script>
 <script src="js/cuenta.js"></script>
  
  <script>
    // Función unificada que detecta si estás en PC o Celular al hacer clic en el logo
    window.toggleSidebar = function() {
      const sidebar = document.getElementById('sidebar');
      if (!sidebar) return;

      if (window.innerWidth <= 768) {
        // En móviles, abre o cierra el panel lateral deslizante
        sidebar.classList.toggle('mobile-open');
      } else {
        // En escritorio, colapsa o expande el menú y mueve el contenido
        sidebar.classList.toggle('collapsed');
        const mainContent = document.getElementById('mainContent');
        if (mainContent) {
          mainContent.classList.toggle('expanded');
        }
      }
    };

    window.toggleMobileSidebar = function() {
      const sidebar = document.getElementById('sidebar');
      if (sidebar) {
        sidebar.classList.toggle('mobile-open');
      }
    };
  </script>
</body>
</html>
