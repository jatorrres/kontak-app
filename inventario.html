<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak - Gestor de Inventario</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    /* Forzar visibilidad y color blanco en los títulos generales */
    .main-content h2 {
      color: #FFFFFF !important;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      margin-bottom: 1.5rem;
    }

    /* Barra de controles avanzados (Buscador + Filtros + Botón) */
    .advanced-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      margin-bottom: 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 1rem;
      border-radius: 12px;
      backdrop-filter: blur(6px);
    }

    .advanced-controls input,
    .advanced-controls select {
      padding: 0.65rem 1rem;
      border-radius: 8px;
      border: 1px solid #CBD5E1;
      background: #FFFFFF;
      font-size: 0.9rem;
      outline: none;
    }

    .search-flex {
      flex: 2;
      min-width: 200px;
    }

    .filter-flex {
      flex: 1;
      min-width: 150px;
    }

    /* Tabla con fondo sólido para total legibilidad */
    .table-container {
      background: #FFFFFF;
      border-radius: 14px;
      padding: 1rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      overflow-x: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .data-table th, .data-table td {
      padding: 1rem 0.8rem;
      border-bottom: 1px solid #E2E8F0;
      color: #1E293B;
    }

    .data-table th {
      background-color: #F8FAFC;
      color: #475569;
      font-weight: 700;
    }

    /* Animación fluida y efectos hover para todos los botones de Kontak */
    .btn-kontak {
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    .btn-kontak:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .btn-kontak:active {
      transform: translateY(0);
    }

    /* Forzar modales ocultos por defecto */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay.active {
      display: flex !important;
    }
    .modal-content {
      background: #FFFFFF;
      padding: 2rem;
      border-radius: 16px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      color: #1E293B;
    }
  </style>
</head>
<body>
  <!-- Botón flotante para abrir el menú en móviles -->
<button class="mobile-menu-btn" onclick="toggleMobileSidebar()">
  <i class="bi bi-list"></i>
</button>
  <div class="app-layout">

    <!-- Contenido Principal -->
    <main class="main-content" id="mainContent">
      <h2>Gestión de Inventario</h2>

      <!-- Controles Superiores con Filtros y Ordenamiento -->
      <div class="advanced-controls">
        <input type="text" id="searchInput" class="search-flex" onkeyup="filterAndSortProducts()" placeholder="🔍 Buscar por nombre o código...">
        
        <select id="filterCategory" class="filter-flex" onchange="filterAndSortProducts()">
          <option value="">Todas las categorías</option>
          <option value="General">General</option>
          <option value="Bebidas">Bebidas</option>
          <option value="Comida">Comida</option>
        </select>

        <select id="sortBy" class="filter-flex" onchange="filterAndSortProducts()">
          <option value="nombre">Ordenar por: Nombre</option>
          <option value="precio-asc">Precio: Menor a Mayor</option>
          <option value="precio-desc">Precio: Mayor a Menor</option>
          <option value="stock">Stock disponible</option>
        </select>

        <button onclick="openModal()" class="btn-kontak" style="background-color: #FF9800; color: white; border: none; padding: 0.7rem 1.2rem; border-radius: 8px; font-weight: bold;">+ Agregar Producto</button>
      </div>

      <!-- Tabla de Productos -->
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>Código</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody">
            <tr><td colspan="7" style="text-align:center;">Cargando inventario...</td></tr>
          </tbody>
        </table>
      </div>
    </main>

    <!-- Sidebar Dinámico -->
    <aside class="sidebar" id="sidebar">
  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="sidebar-top">
    <!-- Cambiar toggleMobileSidebar() por toggleSidebar() aquí -->
    <div class="logo-container" onclick="toggleSidebar()" title="Alternar menú">
      <img src="assets/logo-kontak.png" alt="Kontak Logo">
    </div>
    <nav class="sidebar-nav"></nav>
  </div>
  <div class="sidebar-bottom">
    <a href="index.html" class="nav-item logout-btn"><i class="bi bi-box-arrow-right"></i> Cerrar Sesión</a>
  </div>
</aside>
  </div>

  <!-- MODAL 1: Agregar Producto (Con botones estilizados y animados) -->
  <div class="modal-overlay" id="modalProductOverlay" onclick="closeOnOverlayClick(event)">
    <div class="modal-content">
      <h3 style="margin-top: 0; color: #1E293B;">Nuevo Producto</h3>
      <form id="productForm" onsubmit="saveProduct(event)">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label style="display:block; font-weight:bold; margin-bottom:0.3rem;">Código:</label>
          <input type="text" id="productCode" style="width:100%; padding:0.6rem; border:1px solid #CBD5E1; border-radius:6px;" required>
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
          <label style="display:block; font-weight:bold; margin-bottom:0.3rem;">Nombre:</label>
          <input type="text" id="productName" style="width:100%; padding:0.6rem; border:1px solid #CBD5E1; border-radius:6px;" required>
        </div>
        
        <!-- Selector de Categoría y Botón de Gestión -->
        <div class="form-group" style="margin-bottom: 1rem;">
          <label style="display:block; font-weight:bold; margin-bottom:0.3rem;">Categoría:</label>
          <div style="display: flex; gap: 0.5rem;">
            <select id="productCategory" style="width:100%; padding:0.6rem; border:1px solid #CBD5E1; border-radius:6px;" required>
              <option value="">Seleccione una categoría</option>
              <option value="General">General</option>
              <option value="Bebidas">Bebidas</option>
              <option value="Comida">Comida</option>
            </select>
            <button type="button" class="btn-kontak" onclick="openManageCategoriesModal()" title="Administrar Categorías" style="background: #2563EB; color: white; border: none; padding: 0.6rem 0.9rem; border-radius: 6px; font-weight: bold;">
              <i class="bi bi-gear-fill"></i>
            </button>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label style="display:block; font-weight:bold; margin-bottom:0.3rem;">Precio:</label>
          <input type="number" id="productPrice" step="0.01" style="width:100%; padding:0.6rem; border:1px solid #CBD5E1; border-radius:6px;" required>
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label style="display:block; font-weight:bold; margin-bottom:0.3rem;">Stock:</label>
          <input type="number" id="productStock" style="width:100%; padding:0.6rem; border:1px solid #CBD5E1; border-radius:6px;" required>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 0.8rem;">
          <button type="button" class="btn-kontak" onclick="closeModal()" style="padding: 0.6rem 1.2rem; background: #64748B; color: white; border: none; border-radius: 6px; font-weight: 500;">Cancelar</button>
          <button type="submit" class="btn-kontak" style="padding: 0.6rem 1.2rem; background: #059669; color: white; border: none; border-radius: 6px; font-weight: bold;">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: Administrar, Editar y Borrar Categorías -->
  <div class="modal-overlay" id="manageCategoriesModal">
    <div class="modal-content" style="max-width: 400px;">
      <h3 style="margin-top: 0; color: #1E293B;">Administrar Categorías</h3>
      
      <!-- Input para agregar nueva categoría -->
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
        <input type="text" id="newCategoryInput" placeholder="Nueva categoría..." style="flex: 1; padding: 0.5rem; border: 1px solid #CBD5E1; border-radius: 6px;">
        <button type="button" class="btn-kontak" onclick="addNewCategoryToList()" style="background: #059669; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: bold;">Agregar</button>
      </div>

      <!-- Lista de categorías existentes con opciones de Editar y Borrar -->
      <div id="categoriesListContainer" style="max-height: 200px; overflow-y: auto; border: 1px solid #E2E8F0; border-radius: 6px; padding: 0.5rem; margin-bottom: 1rem; background: #F8FAFC;">
        <!-- Se llenará dinámicamente desde JS -->
      </div>

      <div style="display: flex; justify-content: flex-end;">
        <button type="button" class="btn-kontak" onclick="closeManageCategoriesModal()" style="padding: 0.5rem 1rem; background: #64748B; color: white; border: none; border-radius: 6px;">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- MODAL 3: Confirmar Eliminación -->
  <div class="modal-overlay" id="confirmDeleteModal">
    <div class="modal-content">
      <h3 style="margin-top: 0;">¿Eliminar Producto?</h3>
      <p>Esta acción no se puede deshacer.</p>
      <div style="display: flex; justify-content: flex-end; gap: 0.8rem; margin-top: 1.5rem;">
        <button type="button" class="btn-kontak" onclick="closeConfirmModal()" style="padding: 0.6rem 1.2rem; background: #64748B; color: white; border: none; border-radius: 6px;">Cancelar</button>
        <button type="button" class="btn-kontak" onclick="confirmDeleteProduct()" style="padding: 0.6rem 1.2rem; background: #EF4444; color: white; border: none; border-radius: 6px; font-weight: bold;">Eliminar</button>
      </div>
    </div>
  </div>

  <script src="js/sidebar.js"></script>
  <script src="js/inventario.js"></script>
  <script>
    // Función unificada que detecta si estás en PC o Celular al hacer clic en el logo
    window.toggleSidebar = function() {
      const sidebar = document.getElementById('sidebar');
      if (!sidebar) return;

      if (window.innerWidth <= 768) {
        // En móviles, abre o cierra el panel lateral deslizante
        sidebar.classList.toggle('mobile-open');
      } else {
        // En escritorio, colapsa o expande el menú y mueve el contenido
        sidebar.classList.toggle('collapsed');
        const mainContent = document.getElementById('mainContent');
        if (mainContent) {
          mainContent.classList.toggle('expanded');
        }
      }
    };

    window.toggleMobileSidebar = function() {
      const sidebar = document.getElementById('sidebar');
      if (sidebar) {
        sidebar.classList.toggle('mobile-open');
      }
    };
  </script>
</body>
</html>
